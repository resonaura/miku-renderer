trigger:
  branches:
    include:
      - release

pool:
  vmImage: ubuntu-latest

steps:
  # 1. Install Node.js
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: '⚙️  Install Node.js'

  # 2. SSH deploy
  - task: SSH@0
    displayName: '🔐  Connect via SSH & Deploy'
    inputs:
      sshEndpoint: 'Kitty Server (Miku)'
      runOptions: inline
      inline: |
        echo "🔑  Step 1: connecting to SSH"
        echo "📥  Step 2: pulling latest changes"
        cd ${PROJECT_ROOT}
        git pull origin release

        echo "📦  Step 3: installing dependencies"
        npm install

        echo "🏗️  Step 4: building the project"
        npm run build

        echo "🔄  Step 5: restarting the app"
        pm2 restart ${PM2_APP_NAME}

        echo "✅  Deployment on branch release completed successfully"
